<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ポーカーカスタムタイマー</title>
	<style>
		:root {
			--bg-color: #121212;
			--container-bg: #1e1e1e;
			--card-bg: #262626;
			--border-color: #333333;
			--text-color: #ffffff;
			--text-muted: #aaaaaa;
			--accent-color: #00bfff;
			--accent-hover: #009acd;
			--danger-color: #ff4d4d;
			--danger-hover: #cc0000;
			--success-color: #28a745;
			--warning-color: #ffc107;
			--warning-hover: #e0a800;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background-color: var(--bg-color);
			color: var(--text-color);
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px 0;
			box-sizing: border-box;
		}

		.clock-container {
			width: 90%;
			max-width: 850px;
			padding: 30px;
			background-color: var(--container-bg);
			border-radius: 0.75rem;
			box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.6);
			text-align: center;
			box-sizing: border-box;
			position: relative;
		}

		/* デジタル時計表示 */
		.digital-clock {
			font-size: 8rem;
			font-family: "Nunito", sans-serif;
			font-weight: 900;
			letter-spacing: 6px;
			font-variant-numeric: tabular-nums;
			color: var(--accent-color);
			text-shadow: 0 0 20px rgba(0,191,255,0.5);
			margin: 15px 0;
			line-height: 1;
		}

		.screen {
			display: none;
		}
		.screen.active {
			display: block;
		}

		/* ボタン基本スタイル */
		button {
			cursor: pointer;
			font-weight: bold;
			border: none;
			border-radius: 4px;
			transition: background 0.2s;
		}

		.btn-primary {
			background-color: var(--accent-color);
			color: #000;
			padding: 10px 20px;
			font-size: 1rem;
		}
		.btn-primary:hover {
			background-color: var(--accent-hover);
			color: #fff;
		}

		.btn-secondary {
			background-color: #444;
			color: #fff;
			padding: 8px 16px;
			font-size: 0.95rem;
		}
		.btn-secondary:hover {
			background-color: #555;
		}

		.btn-danger {
			background-color: var(--danger-color);
			color: #fff;
			padding: 4px 8px;
			font-size: 0.85rem;
		}
		.btn-danger:hover {
			background-color: var(--danger-hover);
		}

		/* 設定画面スタイル */
		.config-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}
		.config-header h2 {
			margin: 0;
			font-size: 1.4rem;
		}

		.config-actions {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		/* 音声トグルスイッチ */
		.sound-switch-container {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 0.9rem;
			font-weight: bold;
			background-color: var(--card-bg);
			padding: 6px 12px;
			border-radius: 20px;
			border: 1px solid var(--border-color);
			user-select: none;
		}

		.switch {
			position: relative;
			display: inline-block;
			width: 38px;
			height: 20px;
		}

		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #555;
			transition: .3s;
			border-radius: 20px;
		}

		.slider:before {
			position: absolute;
			content: "";
			height: 14px;
			width: 14px;
			left: 3px;
			bottom: 3px;
			background-color: white;
			transition: .3s;
			border-radius: 50%;
		}

		input:checked + .slider {
			background-color: var(--accent-color);
		}

		input:checked + .slider:before {
			transform: translateX(18px);
		}

		.table-responsive {
			max-height: 400px;
			overflow-y: auto;
			margin-bottom: 20px;
			border: 1px solid var(--border-color);
			border-radius: 4px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: center;
			background-color: var(--card-bg);
		}

		th, td {
			padding: 10px 8px;
			border-bottom: 1px solid var(--border-color);
		}

		th {
			background-color: #2c2c2c;
			color: var(--accent-color);
			position: sticky;
			top: 0;
			z-index: 10;
		}

		input[type="number"] {
			width: 70px;
			padding: 6px;
			background-color: #121212;
			border: 1px solid var(--border-color);
			color: var(--text-color);
			text-align: center;
			border-radius: 4px;
			font-size: 0.95rem;
		}
		input[type="number"]:focus {
			outline: none;
			border-color: var(--accent-color);
		}

		/* タイマー画面スタイル */
		.timer-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 10px;
		}

		.level-badge {
			font-size: 1.5rem;
			color: var(--accent-color);
			font-weight: bold;
			letter-spacing: 1px;
			user-select: none;
			-webkit-user-select: none;
			cursor: pointer;
			transition: color 0.3s;
		}

		/* 隠し機能発動時のレベル表示スタイル */
		.level-badge.secret-active {
			color: #483d8b;
			text-shadow: 0 0 10px rgba(72,61,139,0.4);
		}

		.blinds-info {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 12px;
			background-color: var(--card-bg);
			padding: 15px;
			border-radius: 8px;
			margin-bottom: 15px;
			border: 1px solid var(--border-color);
		}

		.blind-item .label {
			font-size: 0.85rem;
			color: var(--text-muted);
			margin-bottom: 4px;
		}

		.blind-item .value {
			font-size: 1.5rem;
			font-weight: bold;
			color: var(--text-color);
		}

		.time-adjust-group {
			transform: translateY(-15px);
			display: flex;
			flex-direction: column;
			gap: 8px;
			margin-bottom: 20px;
		}

		.time-adjust-controls {
			display: flex;
			justify-content: center;
			gap: 8px;
		}

		.btn-adjust {
			background-color: #2a2a2a;
			color: var(--text-color);
			border: 1px solid var(--border-color);
			padding: 8px 12px;
			font-size: 0.85rem;
			flex: 1;
			max-width: 110px;
		}
		.btn-adjust:hover {
			background-color: #3a3a3a;
			border-color: var(--accent-color);
		}

		.main-controls {
			display: flex;
			justify-content: center;
			gap: 12px;
			align-items: center;
		}

		.btn-control {
			padding: 12px 24px;
			font-size: 1.1rem;
			border-radius: 6px;
			flex: 1;
		}

		.btn-start {
			background-color: var(--success-color);
			color: #fff;
		}
		.btn-start:hover {
			background-color: #218838;
		}

		.btn-pause {
			background-color: var(--warning-color);
			color: #000;
		}
		.btn-pause:hover {
			background-color: var(--warning-hover);
		}

		.btn-reset {
			background-color: #555;
			color: #fff;
		}
		.btn-reset:hover {
			background-color: #666;
		}

		/* 通知用バナー */
		#notification-banner {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			background: linear-gradient(135deg, rgba(0, 191, 255, 0.95), rgba(0, 122, 204, 0.95));
			color: #000;
			padding: 12px;
			box-sizing: border-box;
			text-align: center;
			font-weight: bold;
			box-shadow: 0 4px 15px rgba(0,0,0,0.5);
			z-index: 100;
			border-top-left-radius: 0.75rem;
			border-top-right-radius: 0.75rem;
			cursor: pointer;
			animation: slideDown 0.3s ease-out;
		}

		@keyframes slideDown {
			from { transform: translateY(-100%); opacity: 0; }
			to { transform: translateY(0); opacity: 1; }
		}

		/* レスポンシブ対応（スマホ向けレイアウト調整） */
		@media (max-width: 480px) {
			body {
				height: 100dvh;
				min-height: auto;
				padding: 0;
				overflow: hidden;
			}

			.clock-container {
				width: 100%;
				height: 100dvh;
				max-height: 100dvh;
				padding: 8px 12px;
				border-radius: 0;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				box-sizing: border-box;
			}

			.screen.active {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				height: 100%;
			}

			.timer-header {
				margin-bottom: 2px;
			}

			.level-badge {
				font-size: 1.2rem;
			}

			.blinds-info {
				padding: 10px 6px;
				gap: 4px;
				margin-bottom: 2px;
			}

			.blind-item .label {
				font-size: 0.75rem;
				margin-bottom: 2px;
			}

			.blind-item .value {
				font-size: 1.4rem;
			}

			.digital-clock {
				font-size: clamp(5.5rem, 28vw, 10rem);
				margin: 0;
				line-height: 0.9;
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.time-adjust-group {
				gap: 3px;
				margin-bottom: 6px;
			}

			.time-adjust-controls {
				gap: 4px;
			}

			.btn-adjust {
				padding: 5px 0;
				font-size: 0.75rem;
			}

			.btn-control {
				padding: 14px 4px;
				font-size: 1rem;
			}

			.config-header h2 {
				font-size: 1.1rem;
			}

			.table-responsive {
				max-height: 40dvh;
				margin-bottom: 10px;
			}

			th, td {
				padding: 6px 2px;
				font-size: 0.85rem;
			}

			input[type="number"] {
				width: 55px;
				padding: 4px;
				font-size: 0.85rem;
			}

			#notification-banner {
				border-top-left-radius: 0;
				border-top-right-radius: 0;
			}
		}
	</style>
</head>
<body>

	<div class="clock-container">
		<!-- 通知バナー -->
		<div id="notification-banner" onclick="closeBanner()">
			<div class="banner-title" id="banner-title">🔔 レベルアップ！</div>
			<div style="font-size: 0.8rem; opacity: 0.85;">タップして閉じる</div>
		</div>

		<!-- 画面1: ブラインド設定画面 -->
		<div id="config-screen" class="screen active">
			<div class="config-header">
				<h2>ブラインド設定</h2>
				<div class="config-actions">
					<!-- サウンドON/OFF切替 -->
					<div class="sound-switch-container">
						<span>🔊</span>
						<label class="switch">
							<input type="checkbox" id="sound-toggle" checked onchange="toggleSoundSetting(this)">
							<span class="slider"></span>
						</label>
					</div>
					<button class="btn-primary" onclick="addLevelRow()">＋ 追加</button>
				</div>
			</div>
			
			<div class="table-responsive">
				<table id="blind-table">
					<thead>
						<tr>
							<th>Lv</th>
							<th>時間(分)</th>
							<th>BB</th>
							<th>SB</th>
							<th>アンティ</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="table-body">
						<!-- JavaScriptで動的に生成 -->
					</tbody>
				</table>
			</div>

			<button class="btn-primary" style="width: 100%; padding: 12px; font-size: 1.1rem;" onclick="startTimerApp()">タイマーを開始する</button>
		</div>

		<!-- 画面2: タイマー画面 -->
		<div id="timer-screen" class="screen">
			<div class="timer-header">
				<div class="level-badge" id="display-level" onclick="handleSecretTap()">LEVEL 1</div>
				<button class="btn-secondary" onclick="backToConfig()">設定へ</button>
			</div>

			<!-- ブラインド情報表示エリア -->
			<div class="blinds-info">
				<div class="blind-item">
					<div class="label">SB</div>
					<div class="value" id="display-sb">0</div>
				</div>
				<div class="blind-item">
					<div class="label">BB</div>
					<div class="value" id="display-bb">0</div>
				</div>
				<div class="blind-item">
					<div class="label">ANTE</div>
					<div class="value" id="display-ante">0</div>
				</div>
			</div>

			<!-- メインタイマー表示 -->
			<div class="digital-clock" id="timer-display">00:00</div>

			<!-- 時間微調整ボタンエリア -->
			<div class="time-adjust-group">
				<div class="time-adjust-controls">
					<button class="btn-adjust" onclick="adjustTime(-30)">-30秒</button>
					<button class="btn-adjust" onclick="adjustTime(-60)">-1分</button>
					<button class="btn-adjust" onclick="adjustTime(-300)">-5分</button>
				</div>
				<div class="time-adjust-controls">
					<button class="btn-adjust" onclick="adjustTime(30)">+30秒</button>
					<button class="btn-adjust" onclick="adjustTime(60)">+1分</button>
					<button class="btn-adjust" onclick="adjustTime(300)">+5分</button>
				</div>
			</div>

			<!-- メイン操作ボタン -->
			<div class="main-controls">
				<button class="btn-control btn-reset" onclick="resetCurrentLevel()">リセット</button>
				<button class="btn-control btn-start" id="toggle-btn" onclick="toggleTimer()">スタート</button>
				<button class="btn-control btn-secondary" onclick="nextLevelManual()">次へ ⏩</button>
			</div>
		</div>
	</div>

<script>
	// 初期レベルデータ（規定値）
	const initialLevels = [
		{ time: 15, sb: 100, bb: 200, ante: 200 },
		{ time: 15, sb: 200, bb: 400, ante: 400 },
		{ time: 15, sb: 300, bb: 600, ante: 600 },
		{ time: 15, sb: 400, bb: 800, ante: 800 },
		{ time: 15, sb: 500, bb: 1000, ante: 1000 }
	];

	let levelsData = [];
	let currentLevelIndex = 0;
	let remainingSeconds = 0;
	let timerInterval = null;
	let isRunning = false;
	let audioCtx = null;
	let isSoundEnabled = true;

	// 隠し機能用変数
	let secretTapCount = 0;
	let isSecretSpeedActive = false;
	let secretTapTimer = null;

	// 初期表示時に初期データから行を作成
	window.addEventListener('DOMContentLoaded', () => {
		initialLevels.forEach(lvl => addLevelRow(lvl.time, lvl.bb, lvl.sb, lvl.ante));
	});

	// サウンドトグル切替
	function toggleSoundSetting(checkbox) {
		isSoundEnabled = checkbox.checked;
	}

	// 設定テーブルに新しい行を追加
	function addLevelRow(time = 15, bb = 1000, sb = 500, ante = 500) {
		const tbody = document.getElementById('table-body');
		const tr = document.createElement('tr');

		// Lv番号
		const tdNum = document.createElement('td');
		tdNum.className = 'lv-num';
		tr.appendChild(tdNum);

		// 各入力項目定義
		const fields = [
			{ className: 'input-time', value: time, min: 1, max: 999 },
			{ className: 'input-bb', value: bb, min: 0},
			{ className: 'input-sb', value: sb, min: 0},
			{ className: 'input-ante', value: ante, min: 0}
		];

		fields.forEach(field => {
			const td = document.createElement('td');
			const input = document.createElement('input');
			input.type = 'number';
			input.className = field.className;
			input.value = Math.max(field.min, Number(field.value) || 0);
			input.min = field.min;

			// 入力時リアルタイムバリデーション（最小値未満やNaNを防ぐ）
			input.addEventListener('input', (e) => {
				let val = Number(e.target.value);
				if (val < field.min) val = field.min;
				if (field.max && val > field.max) val = field.max;
				e.target.value = val;
			});

			td.appendChild(input);
			tr.appendChild(td);
		});

		// 削除ボタン
		const tdAction = document.createElement('td');
		const deleteBtn = document.createElement('button');
		deleteBtn.className = 'btn-danger';
		deleteBtn.type = 'button';
		deleteBtn.innerText = '削除';
		deleteBtn.addEventListener('click', () => removeLevelRow(deleteBtn));
		tdAction.appendChild(deleteBtn);
		tr.appendChild(tdAction);

		tbody.appendChild(tr);
		updateLevelNumbers();
	}

	// 指定した行を削除
	function removeLevelRow(btn) {
		const tbody = document.getElementById('table-body');
		if (tbody.rows.length <= 1) {
			alert("最低1つのレベルが必要です。");
			return;
		}
		btn.closest('tr').remove();
		updateLevelNumbers();
	}

	// レベル番号の再振り分け
	function updateLevelNumbers() {
		const rows = document.querySelectorAll('#table-body tr');
		rows.forEach((row, idx) => {
			row.querySelector('.lv-num').innerText = idx + 1;
		});
	}

	// テーブルから最新の設定データを配列として読み出し（安全値処理付き）
	function collectTableData() {
		const rows = document.querySelectorAll('#table-body tr');
		const data = [];
		rows.forEach(row => {
			const time = Math.max(1, parseInt(row.querySelector('.input-time').value) || 1);
			const bb = Math.max(0, parseInt(row.querySelector('.input-bb').value) || 0);
			const sb = Math.max(0, parseInt(row.querySelector('.input-sb').value) || 0);
			const ante = Math.max(0, parseInt(row.querySelector('.input-ante').value) || 0);
			data.push({ time, bb, sb, ante });
		});
		return data;
	}

	// 設定からタイマー画面へ移動
	function startTimerApp() {
		levelsData = collectTableData();
		if (levelsData.length === 0) {
			alert("ブラインド設定を正しく入力してください。");
			return;
		}
		currentLevelIndex = 0;
		loadLevel(currentLevelIndex);

		document.getElementById('config-screen').classList.remove('active');
		document.getElementById('timer-screen').classList.add('active');
	}

	// タイマー画面から設定画面へ戻る
	function backToConfig() {
		pauseTimer();
		document.getElementById('timer-screen').classList.remove('active');
		document.getElementById('config-screen').classList.add('active');
		closeBanner();
		// 隠し機能解除
		isSecretSpeedActive = false;
		secretTapCount = 0;
		document.getElementById('display-level').classList.remove('secret-active');
	}

	// 指定レベルのデータを画面にセット
	function loadLevel(index) {
		if (index >= levelsData.length) {
			alert("すべてのレベルが終了しました！");
			currentLevelIndex = levelsData.length - 1;
			return;
		}
		const lvl = levelsData[index];
		document.getElementById('display-level').innerText = `LEVEL ${index + 1}`;
		
		// 隠し状態に応じた文字色クラス
		if (isSecretSpeedActive) {
			document.getElementById('display-level').classList.add('secret-active');
		} else {
			document.getElementById('display-level').classList.remove('secret-active');
		}

		document.getElementById('display-sb').innerText = lvl.sb.toLocaleString();
		document.getElementById('display-bb').innerText = lvl.bb.toLocaleString();
		document.getElementById('display-ante').innerText = lvl.ante.toLocaleString();
		
		remainingSeconds = Number(lvl.time) * 60;
		updateDisplay();
	}

	// 時間表示の更新
	function updateDisplay() {
		const mins = Math.floor(remainingSeconds / 60);
		const secs = remainingSeconds % 60;
		document.getElementById('timer-display').innerText = 
			`${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
	}

	// タイマーのスタート/一時停止切替
	function toggleTimer() {
		if (isRunning) {
			pauseTimer();
		} else {
			startTimer();
		}
	}

	// タイマー開始
	function startTimer() {
		if (isRunning) return;
		if (isSoundEnabled) {
			initAudio();
		}
		isRunning = true;
		const btn = document.getElementById('toggle-btn');
		btn.innerText = "一時停止";
		btn.classList.remove('btn-start');
		btn.classList.add('btn-pause');

		// 隠し機能発動時は1秒を800msに短縮（1.25倍速）
		const intervalTime = isSecretSpeedActive ? 800 : 1000;

		timerInterval = setInterval(() => {
			if (remainingSeconds > 0) {
				remainingSeconds--;
				updateDisplay();
			}

			if (remainingSeconds <= 0) {
				clearInterval(timerInterval);
				isRunning = false;
				playAlarmSound();
				
				// 次のレベルへ自動移行
				currentLevelIndex++;
				if (currentLevelIndex < levelsData.length) {
					showBanner(`LEVEL ${currentLevelIndex + 1} へ移行します`);
					loadLevel(currentLevelIndex);
				} else {
					showBanner("全レベルが終了しました！");
					document.getElementById('display-level').innerText = "FINISH";
				}

				const btn = document.getElementById('toggle-btn');
				btn.innerText = "スタート";
				btn.classList.remove('btn-pause');
				btn.classList.add('btn-start');
			}
		}, intervalTime);
	}

	// タイマー停止
	function pauseTimer() {
		if (!isRunning) return;
		clearInterval(timerInterval);
		isRunning = false;
		const btn = document.getElementById('toggle-btn');
		btn.innerText = "スタート";
		btn.classList.remove('btn-pause');
		btn.classList.add('btn-start');
	}

	// 現在のレベルの時間をリセット
	function resetCurrentLevel() {
		pauseTimer();
		closeBanner();
		const lvl = levelsData[currentLevelIndex];
		if (lvl) {
			remainingSeconds = Number(lvl.time) * 60;
			updateDisplay();
		}
	}

	// 時間の微調整 (+/- 秒)
	function adjustTime(sec) {
		remainingSeconds = Math.max(0, Number(remainingSeconds) + Number(sec));
		updateDisplay();
	}

	// 手動で次のレベルへ
	function nextLevelManual() {
		pauseTimer();
		closeBanner();
		currentLevelIndex++;
		if (currentLevelIndex >= levelsData.length) {
			alert("すでに最後のレベルです。");
			currentLevelIndex = levelsData.length - 1;
		}
		loadLevel(currentLevelIndex);
	}

	// AudioContextの初期化（ユーザー操作が必要）
	function initAudio() {
		if (!audioCtx) {
			audioCtx = new (window.AudioContext || window.webkitAudioContext)();
		}
		if (audioCtx.state === 'suspended') {
			audioCtx.resume();
		}
	}

	// アラーム音の再生（ビープ音）
	function playAlarmSound() {
		if (!isSoundEnabled) return;

		try {
			initAudio();
			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();
			osc.type = 'sine';
			osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5音
			osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.2); // A4音へ変化
			
			gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
			gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

			osc.connect(gain);
			gain.connect(audioCtx.destination);

			osc.start();
			osc.stop(audioCtx.currentTime + 0.6);
		} catch (e) {
			console.log("Audio not supported or blocked", e);
		}
	}

	// 通知バナー表示
	function showBanner(message) {
		const banner = document.getElementById('notification-banner');
		const titleElem = document.getElementById('banner-title');
		titleElem.innerText = `🔔 ${message}`;
		banner.style.display = 'block';
	}

	// 通知バナー非表示
	function closeBanner() {
		const banner = document.getElementById('notification-banner');
		banner.style.display = 'none';
	}

	// 隠し機能: レベル文字を5回高速タップでカウント加速（裏コマンド）
	function handleSecretTap() {
		secretTapCount++;
		
		clearTimeout(secretTapTimer);
		secretTapTimer = setTimeout(() => {
			secretTapCount = 0;
		}, 1500);

		if (secretTapCount >= 5) {
			isSecretSpeedActive = !isSecretSpeedActive;
			secretTapCount = 0;
			
			const levelBadge = document.getElementById('display-level');
			if (isSecretSpeedActive) {
				levelBadge.classList.add('secret-active');
			} else {
				levelBadge.classList.remove('secret-active');
			}
			
			// タイマー作動中なら再スタートして反映
			if (isRunning) {
				pauseTimer();
				startTimer();
			}
		}
	}
</script>
